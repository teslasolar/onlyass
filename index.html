<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONLYASS.IO</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a1a;color:#fff;font-family:'Space Mono',monospace;overflow:hidden;text-align:center}
h1{font-family:'Bangers',cursive;font-size:clamp(3rem,10vw,7rem);letter-spacing:.05em;color:#ffcc00;text-shadow:3px 3px 0 #000,0 0 30px rgba(255,204,0,.3);margin-bottom:.2em}
.sub{font-size:clamp(.9rem,2.5vw,1.4rem);color:#ff6600;text-transform:uppercase;letter-spacing:.3em;animation:blink 1.2s steps(1) infinite;margin-bottom:2rem}
@keyframes blink{50%{opacity:.3}}
.manhole{position:relative;width:clamp(200px,50vw,360px);aspect-ratio:1}
.manhole svg{width:100%;height:100%;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.tape{position:absolute;width:140%;height:38px;background:repeating-linear-gradient(45deg,#ffcc00 0 18px,#111 18px 36px);left:-20%;opacity:.92;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.tape.t1{top:18%;transform:rotate(-18deg)}
.tape.t2{bottom:22%;transform:rotate(12deg)}
.tape.t3{top:48%;transform:rotate(-4deg)}
.footer{margin-top:2.5rem;font-size:.75rem;color:#555;letter-spacing:.15em}
.stink{position:absolute;font-size:2rem;animation:float 2.5s ease-in-out infinite}
.stink:nth-child(1){top:-10%;left:30%;animation-delay:0s}
.stink:nth-child(2){top:-15%;left:55%;animation-delay:.8s}
.stink:nth-child(3){top:-8%;left:42%;animation-delay:1.6s}
@keyframes float{0%,100%{transform:translateY(0) scale(1);opacity:.7}50%{transform:translateY(-20px) scale(1.2);opacity:1}}
</style>
</head>
<body>
<h1>ONLYASS.IO</h1>
<p class="sub">🚧 Under Construction 🚧</p>
<div class="manhole">
  <div class="stink">💨</div>
  <div class="stink">💨</div>
  <div class="stink">💨</div>
  <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <!-- hole -->
    <ellipse cx="150" cy="160" rx="100" ry="90" fill="#000"/>
    <ellipse cx="150" cy="160" rx="100" ry="90" fill="none" stroke="#333" stroke-width="8"/>
    <!-- rim -->
    <ellipse cx="150" cy="160" rx="110" ry="98" fill="none" stroke="#555" stroke-width="12"/>
    <!-- cover pushed aside -->
    <g transform="translate(60,-20) rotate(-25,200,180)">
      <ellipse cx="200" cy="180" rx="95" ry="85" fill="#444" stroke="#555" stroke-width="4"/>
      <ellipse cx="200" cy="180" rx="75" ry="67" fill="none" stroke="#555" stroke-width="2"/>
      <ellipse cx="200" cy="180" rx="55" ry="49" fill="none" stroke="#555" stroke-width="2"/>
      <line x1="200" y1="100" x2="200" y2="260" stroke="#555" stroke-width="2"/>
      <line x1="118" y1="180" x2="282" y2="180" stroke="#555" stroke-width="2"/>
      <rect x="185" y="168" width="30" height="6" rx="3" fill="#666"/>
    </g>
    <!-- depth lines -->
    <line x1="70" y1="170" x2="80" y2="240" stroke="#222" stroke-width="2"/>
    <line x1="230" y1="170" x2="220" y2="240" stroke="#222" stroke-width="2"/>
  </svg>
  <div class="tape t1"></div>
  <div class="tape t2"></div>
  <div class="tape t3"></div>
</div>
<p class="footer">SOMETHING STINKS... COMING SOON</p>
</body>
</html>
