<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iris Trainer — p=13 · OnlyASS.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Space+Mono:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#888;font-family:'Space Mono',monospace;min-height:100vh;padding:2rem;display:flex;flex-direction:column;align-items:center}
::selection{background:#8C50C8;color:#fff}
a{color:#8C50C8;text-decoration:none;transition:opacity 0.3s}
a:hover{opacity:0.7}
h1{font-family:'Creepster',cursive;font-size:clamp(1.5rem,4vw,2.5rem);color:#8C50C8;text-shadow:0 0 30px rgba(140,80,200,0.3);margin-bottom:0.5rem}
.subtitle{font-family:'Inter',sans-serif;font-weight:300;font-size:0.75rem;color:#555;letter-spacing:2px;margin-bottom:0.5rem}
.tagline{font-family:'Inter',sans-serif;font-weight:300;font-size:0.8rem;color:#8C50C8;letter-spacing:1px;margin-bottom:2rem;text-align:center;line-height:1.6}
canvas{cursor:pointer;border-radius:50%}
.ring-states{display:flex;gap:8px;margin-top:2rem;flex-wrap:wrap;justify-content:center}
.ring-state{font-size:0.6rem;letter-spacing:1px;padding:6px 10px;background:#0f0f0f;border-radius:4px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:all 0.3s;border:1px solid transparent;user-select:none}
.ring-state:hover{border-color:#333}
.ring-state.active{border-color:var(--rc);opacity:1}
.ring-state.dim{opacity:0.35}
.ring-state .dot{width:8px;height:8px;border-radius:50%}
.instructions{font-family:'Inter',sans-serif;font-weight:300;font-size:0.65rem;color:#444;margin-top:1.5rem;letter-spacing:1px}
footer{text-align:center;padding:3rem 0 2rem;border-top:1px solid #1a1a1a;margin-top:3rem;width:100%}
footer .ring-nav{font-size:0.75rem;letter-spacing:2px;margin-bottom:1rem}
footer .ring-nav a{margin:0 4px}
footer .ring-nav a.current{color:#8C50C8;text-decoration:underline}
footer .fold{font-size:0.6rem;color:#333;letter-spacing:4px}
</style>
</head>
<body>

<h1>Iris Trainer</h1>
<p class="subtitle">7 layers of the eye. 7 layers of you.</p>
<p class="tagline">The iris of the eye has 7 layers. So do you.<br>Click a ring to activate or dim it.</p>

<canvas id="iris" width="400" height="400"></canvas>

<div class="ring-states" id="states"></div>
<p class="instructions">Click the colored rings on the iris or the labels below to toggle.</p>

<footer>
  <div class="ring-nav">
    <a href="../../2/">2</a> ·
    <a href="../../3/">3</a> ·
    <a href="../../5/">5</a> ·
    <a href="../../7/">7</a> ·
    <a href="../../11/">11</a> ·
    <a href="../../13/" class="current">13</a> ·
    <a href="../../17/">17</a> ·
    <a href="../../∞/">∞</a>
  </div>
  <div class="fold">fold = 510,510</div>
</footer>

<script>
const rings = [
  { name: 'R0 Body', color: '#B42838', active: true },
  { name: 'R1 Signal', color: '#E06800', active: true },
  { name: 'R2 Gate', color: '#1A8A32', active: true },
  { name: 'R3 Heart', color: '#2850A8', active: true },
  { name: 'R4 Voice', color: '#C8A820', active: true },
  { name: 'R5 Mirror', color: '#8C50C8', active: true },
  { name: 'R6 Watcher', color: '#888888', active: true }
];

const canvas = document.getElementById('iris');
const ctx = canvas.getContext('2d');
const cx = 200, cy = 200;
const maxRadius = 180;
const pupilRadius = 30;
const ringWidth = (maxRadius - pupilRadius) / 7;

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function drawIris() {
  ctx.clearRect(0, 0, 400, 400);

  // Outer dark circle (sclera hint)
  ctx.beginPath();
  ctx.arc(cx, cy, maxRadius + 5, 0, Math.PI * 2);
  ctx.fillStyle = '#0a0a0a';
  ctx.fill();

  // Draw rings from outside in
  for (let i = 6; i >= 0; i--) {
    const outerR = pupilRadius + ringWidth * (i + 1);
    const rgb = hexToRgb(rings[i].color);
    const alpha = rings[i].active ? 0.7 : 0.12;

    ctx.beginPath();
    ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
    ctx.fill();

    // Ring border
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${rings[i].active ? 0.9 : 0.2})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Texture lines radiating from center
    if (rings[i].active) {
      const innerR = pupilRadius + ringWidth * i;
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 24) {
        ctx.beginPath();
        ctx.moveTo(cx + innerR * Math.cos(a), cy + innerR * Math.sin(a));
        ctx.lineTo(cx + outerR * Math.cos(a + 0.02), cy + outerR * Math.sin(a + 0.02));
        ctx.strokeStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},0.25)`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  // Pupil
  ctx.beginPath();
  ctx.arc(cx, cy, pupilRadius, 0, Math.PI * 2);
  ctx.fillStyle = '#000';
  ctx.fill();

  // Pupil highlight
  ctx.beginPath();
  ctx.arc(cx - 8, cy - 8, 6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fill();
}

function toggleRing(i) {
  rings[i].active = !rings[i].active;
  drawIris();
  updateLabels();
}

// Canvas click detection
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = 400 / rect.width;
  const scaleY = 400 / rect.height;
  const x = (e.clientX - rect.left) * scaleX - cx;
  const y = (e.clientY - rect.top) * scaleY - cy;
  const dist = Math.sqrt(x * x + y * y);

  if (dist < pupilRadius || dist > maxRadius) return;

  const ringIndex = Math.floor((dist - pupilRadius) / ringWidth);
  if (ringIndex >= 0 && ringIndex < 7) {
    toggleRing(ringIndex);
  }
});

// Build labels
const statesEl = document.getElementById('states');
function updateLabels() {
  statesEl.innerHTML = '';
  rings.forEach((ring, i) => {
    const el = document.createElement('div');
    el.className = `ring-state ${ring.active ? 'active' : 'dim'}`;
    el.style.setProperty('--rc', ring.color);
    el.innerHTML = `<span class="dot" style="background:${ring.color}"></span> ${ring.name}`;
    el.addEventListener('click', () => toggleRing(i));
    statesEl.appendChild(el);
  });
}

updateLabels();
drawIris();
</script>
</body>
</html>
