<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucas-Lehmer Cascade — p=13 · OnlyASS.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Space+Mono:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#888;font-family:'Space Mono',monospace;min-height:100vh;padding:2rem;display:flex;flex-direction:column;align-items:center}
::selection{background:#8C50C8;color:#fff}
a{color:#8C50C8;text-decoration:none;transition:opacity 0.3s}
a:hover{opacity:0.7}
h1{font-family:'Creepster',cursive;font-size:clamp(1.5rem,4vw,2.5rem);color:#8C50C8;text-shadow:0 0 30px rgba(140,80,200,0.3);margin-bottom:0.5rem}
.subtitle{font-family:'Inter',sans-serif;font-weight:300;font-size:0.75rem;color:#555;letter-spacing:2px;margin-bottom:0.5rem}
.formula{font-size:0.7rem;color:#8C50C8;letter-spacing:1px;margin-bottom:2rem}
#cascade{width:min(90vw,500px)}
.node{opacity:0;transform:translateY(-20px);transition:all 0.8s ease-out;margin-bottom:1.5rem;text-align:center}
.node.visible{opacity:1;transform:translateY(0)}
.node .step{font-size:0.65rem;color:#444;letter-spacing:3px;text-transform:uppercase;margin-bottom:0.3rem}
.node .circle{width:80px;height:80px;border-radius:50%;border:2px solid #8C50C8;margin:0 auto 0.5rem;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#8C50C8;transition:all 0.5s}
.node .calc{font-family:'Inter',sans-serif;font-weight:300;font-size:0.65rem;color:#555;letter-spacing:1px}
.node .connector{width:2px;height:30px;background:#8C50C8;margin:0.5rem auto 0;opacity:0.3}
.node.final .circle{border-color:#D4AF37;color:#D4AF37;box-shadow:0 0 30px rgba(212,175,55,0.4);animation:goldPulse 1.5s ease-in-out infinite}
.node.final .result{font-family:'Creepster',cursive;font-size:1.2rem;color:#D4AF37;margin-top:0.5rem;letter-spacing:3px}
@keyframes goldPulse{
  0%,100%{box-shadow:0 0 20px rgba(212,175,55,0.3)}
  50%{box-shadow:0 0 50px rgba(212,175,55,0.6)}
}
#restart{margin-top:2rem;padding:8px 24px;background:none;border:1px solid #8C50C8;color:#8C50C8;font-family:'Space Mono',monospace;font-size:0.7rem;letter-spacing:2px;cursor:pointer;border-radius:4px;transition:all 0.3s}
#restart:hover{background:#8C50C8;color:#111}
footer{text-align:center;padding:3rem 0 2rem;border-top:1px solid #1a1a1a;margin-top:3rem;width:100%}
footer .ring-nav{font-size:0.75rem;letter-spacing:2px;margin-bottom:1rem}
footer .ring-nav a{margin:0 4px}
footer .ring-nav a.current{color:#8C50C8;text-decoration:underline}
footer .fold{font-size:0.6rem;color:#333;letter-spacing:4px}
</style>
</head>
<body>

<h1>Lucas-Lehmer Cascade</h1>
<p class="subtitle">Proving 2<sup>7</sup> - 1 = 127 is prime</p>
<p class="formula">S<sub>n</sub> = (S<sub>n-1</sub><sup>2</sup> - 2) mod 127</p>

<div id="cascade"></div>
<button id="restart">Run again</button>

<footer>
  <div class="ring-nav">
    <a href="../../2/">2</a> ·
    <a href="../../3/">3</a> ·
    <a href="../../5/">5</a> ·
    <a href="../../7/">7</a> ·
    <a href="../../11/">11</a> ·
    <a href="../../13/" class="current">13</a> ·
    <a href="../../17/">17</a> ·
    <a href="../../∞/">∞</a>
  </div>
  <div class="fold">fold = 510,510</div>
</footer>

<script>
const steps = [
  { n: 0, value: 4, calc: 'S₀ = 4 (seed)' },
  { n: 1, value: 14, calc: '(4² - 2) mod 127 = 14' },
  { n: 2, value: 67, calc: '(14² - 2) mod 127 = 67' },
  { n: 3, value: 42, calc: '(67² - 2) mod 127 = 42' },
  { n: 4, value: 111, calc: '(42² - 2) mod 127 = 111' },
  { n: 5, value: 0, calc: '(111² - 2) mod 127 = 0' }
];

function buildCascade() {
  const container = document.getElementById('cascade');
  container.innerHTML = '';

  steps.forEach((step, i) => {
    const node = document.createElement('div');
    node.className = 'node' + (i === steps.length - 1 ? ' final' : '');
    node.innerHTML = `
      <div class="step">S<sub>${step.n}</sub></div>
      <div class="circle">${step.value}</div>
      <div class="calc">${step.calc}</div>
      ${i === steps.length - 1 ? '<div class="result">PRIME. THE COWBELL RINGS.</div>' : '<div class="connector"></div>'}
    `;
    container.appendChild(node);

    setTimeout(() => {
      node.classList.add('visible');
    }, (i + 1) * 800);
  });
}

buildCascade();

document.getElementById('restart').addEventListener('click', () => {
  buildCascade();
});
</script>
</body>
</html>
