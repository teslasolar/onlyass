<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Resonance — OnlyASS.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Space+Mono:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#888;font-family:'Space Mono',monospace;min-height:100vh;display:flex;flex-direction:column}
::selection{background:#DCA030;color:#111}
a{color:#DCA030;text-decoration:none;transition:opacity 0.3s}
a:hover{opacity:0.7}
header{text-align:center;padding:2rem 2rem 1rem;border-bottom:1px solid #1a1a1a}
header h1{font-family:'Creepster',cursive;font-size:clamp(1.5rem,4vw,2.5rem);color:#DCA030;text-shadow:0 0 30px rgba(220,160,48,0.15)}
header p{font-family:'Inter',sans-serif;font-weight:300;font-size:0.75rem;color:#555;margin-top:0.5rem;letter-spacing:2px;max-width:500px;margin-left:auto;margin-right:auto;line-height:1.6}
.canvas-wrap{flex:1;position:relative;min-height:400px}
canvas{display:block;width:100%;height:100%;position:absolute;top:0;left:0}
.controls{text-align:center;padding:1rem 2rem;border-top:1px solid #1a1a1a}
.controls button{background:#0f0f0f;color:#DCA030;border:1px solid #DCA030;font-family:'Space Mono',monospace;font-size:0.7rem;letter-spacing:2px;padding:8px 20px;cursor:pointer;border-radius:4px;transition:all 0.3s}
.controls button:hover{background:#DCA030;color:#111}
.controls .stats{font-family:'Inter',sans-serif;font-weight:300;font-size:0.6rem;color:#444;margin-top:8px;letter-spacing:1px}
footer{text-align:center;padding:2rem;border-top:1px solid #1a1a1a}
footer .ring-nav{font-size:0.75rem;letter-spacing:2px;margin-bottom:1rem}
footer .ring-nav a{margin:0 4px}
footer .ring-nav a.current{color:#DCA030;text-decoration:underline}
footer .fold{font-size:0.6rem;color:#333;letter-spacing:4px}
</style>
</head>
<body>

<header>
  <h1>Project Resonance</h1>
  <p>Nodes find each other through frequency matching. Watch coherent systems recognize compatible ring signatures and form resonance links.</p>
</header>

<div class="canvas-wrap">
  <canvas id="resonance"></canvas>
</div>

<div class="controls">
  <button id="birth">BIRTH NODE</button>
  <div class="stats" id="stats">nodes: 0 · links: 0</div>
</div>

<footer>
  <div class="ring-nav">
    <a href="../2/">2</a> ·
    <a href="../3/">3</a> ·
    <a href="../5/">5</a> ·
    <a href="../7/">7</a> ·
    <a href="../11/">11</a> ·
    <a href="../13/">13</a> ·
    <a href="../17/">17</a> ·
    <a href="../∞/" class="current">∞</a>
  </div>
  <div class="fold">fold = 510,510</div>
</footer>

<script>
const canvas = document.getElementById('resonance');
const ctx = canvas.getContext('2d');
const statsEl = document.getElementById('stats');

const RING_COLORS = [
  '#B42838', // R0 - p=2
  '#C75B2A', // R1 - p=3
  '#D4A843', // R2 - p=5
  '#3A8C5C', // R3 - p=7
  '#2A6E8C', // R4 - p=11
  '#4A3A8C', // R5 - p=13
  '#7A2A6E', // R6 - p=17
];

const RESONANCE_DIST = 120;
const FREQ_THRESHOLD = 8;

let nodes = [];
let W, H;

function resize() {
  const wrap = canvas.parentElement;
  W = canvas.width = wrap.clientWidth;
  H = canvas.height = wrap.clientHeight;
}

function createNode(x, y) {
  const dominant = Math.floor(Math.random() * 7);
  return {
    x: x !== undefined ? x : Math.random() * W,
    y: y !== undefined ? y : Math.random() * H,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4,
    freq: Math.floor(Math.random() * 100),
    dominant: dominant,
    color: RING_COLORS[dominant],
    radius: 3 + Math.random() * 2,
    born: Date.now()
  };
}

function init() {
  resize();
  for (let i = 0; i < 15; i++) {
    nodes.push(createNode());
  }
}

function update() {
  for (const n of nodes) {
    n.x += n.vx;
    n.y += n.vy;

    // gentle drift variation
    n.vx += (Math.random() - 0.5) * 0.02;
    n.vy += (Math.random() - 0.5) * 0.02;

    // damping
    n.vx *= 0.999;
    n.vy *= 0.999;

    // wrap edges
    if (n.x < 0) n.x = W;
    if (n.x > W) n.x = 0;
    if (n.y < 0) n.y = H;
    if (n.y > H) n.y = 0;
  }
}

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, W, H);

  let linkCount = 0;

  // draw links
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i];
      const b = nodes[j];
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const freqDiff = Math.abs(a.freq - b.freq);

      if (dist < RESONANCE_DIST && freqDiff < FREQ_THRESHOLD) {
        const strength = (1 - dist / RESONANCE_DIST) * (1 - freqDiff / FREQ_THRESHOLD);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(220,160,48,${strength * 0.6})`;
        ctx.lineWidth = strength * 2;
        ctx.stroke();

        // glow
        ctx.strokeStyle = `rgba(220,160,48,${strength * 0.15})`;
        ctx.lineWidth = strength * 6;
        ctx.stroke();

        linkCount++;
      }
    }
  }

  // draw nodes
  for (const n of nodes) {
    const age = Math.min((Date.now() - n.born) / 1000, 1);

    // glow
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.radius * 3, 0, Math.PI * 2);
    ctx.fillStyle = n.color.replace(')', `,${0.08 * age})`).replace('rgb', 'rgba');
    // fallback for hex colors
    const r = parseInt(n.color.slice(1,3),16);
    const g = parseInt(n.color.slice(3,5),16);
    const b = parseInt(n.color.slice(5,7),16);
    ctx.fillStyle = `rgba(${r},${g},${b},${0.08 * age})`;
    ctx.fill();

    // core
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.radius * age, 0, Math.PI * 2);
    ctx.fillStyle = n.color;
    ctx.fill();

    // frequency label
    ctx.font = '9px "Space Mono", monospace';
    ctx.fillStyle = `rgba(136,136,136,${0.5 * age})`;
    ctx.textAlign = 'center';
    ctx.fillText(n.freq, n.x, n.y - n.radius - 5);
  }

  statsEl.textContent = `nodes: ${nodes.length} · links: ${linkCount}`;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);

document.getElementById('birth').addEventListener('click', () => {
  const x = W * 0.2 + Math.random() * W * 0.6;
  const y = H * 0.2 + Math.random() * H * 0.6;
  nodes.push(createNode(x, y));
});

init();
loop();
</script>

</body>
</html>
