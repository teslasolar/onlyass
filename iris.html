<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A.S.S. IRIS — Concentric Ring Navigation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;user-select:none}
canvas{display:block}
#info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:10}
#info .name{font-size:clamp(14px,3vw,20px);color:#DCA030;letter-spacing:4px;text-transform:uppercase;transition:color 0.3s;text-shadow:0 0 20px rgba(220,160,48,.3)}
#info .question{font-size:clamp(10px,1.5vw,12px);color:#555;letter-spacing:2px;margin-top:4px}
#info .path{font-size:10px;color:#333;letter-spacing:2px;margin-top:4px}
#title{position:fixed;top:16px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:10}
#title h1{font-size:clamp(11px,1.5vw,14px);color:#333;letter-spacing:8px}
#controls{position:fixed;top:16px;right:16px;z-index:10;display:flex;gap:4px}
#controls button{background:transparent;border:1px solid #1a1a1a;color:#333;padding:4px 10px;border-radius:3px;cursor:pointer;font-family:inherit;font-size:9px;letter-spacing:2px;transition:all 0.3s}
#controls button:hover,#controls button.active{border-color:#DCA030;color:#DCA030}
#fold{position:fixed;bottom:16px;right:16px;font-size:9px;color:#1a1a1a;letter-spacing:3px;z-index:10}
#speed{position:fixed;bottom:16px;left:16px;font-size:9px;color:#333;letter-spacing:2px;z-index:10}
#speed input{width:80px;accent-color:#DCA030;vertical-align:middle}
</style>
</head>
<body>

<div id="title"><h1>A.S.S. IRIS</h1></div>

<div id="controls">
  <button id="btn-spin" class="active" onclick="toggleSpin()">SPIN</button>
  <button id="btn-labels" class="active" onclick="toggleLabels()">LABELS</button>
  <button id="btn-glow" class="active" onclick="toggleGlow()">GLOW</button>
  <button onclick="window.location.href='./'">EXIT</button>
</div>

<canvas id="c"></canvas>

<div id="info">
  <div class="name" id="hover-name">A.S.S. IRIS</div>
  <div class="question" id="hover-q">7 rings · 7 primes · click to navigate</div>
  <div class="path" id="hover-path">scroll to zoom · drag rings to spin</div>
</div>

<div id="speed"><label>speed <input type="range" min="0" max="100" value="30" oninput="setSpeed(this.value)"></label></div>
<div id="fold">510,510</div>

<script src="logger.js"></script>
<script>
const log = ASSLogger.pipe(7);

// ─── Ring data: innermost (p=2) to outermost (p=17) ───
const RINGS = [
  { p:2, name:'ground', color:'#B42838', q:'what are you standing on?', ring:'R0', href:'2/',
    sections:[
      {label:'breath',file:'breath.html',href:'2/breath.html'},
      {label:'floor',file:'floor.html',href:'2/floor.html'},
      {label:'gut',file:'gut.md',href:'2/gut.md'}
    ]},
  { p:3, name:'signal', color:'#008CC8', q:'what comes in?', ring:'R1', href:'3/',
    sections:[
      {label:'audio-sight',file:'audio-sight.html',href:'3/audio-sight.html'},
      {label:'ears',file:'ears.md',href:'3/ears.md'},
      {label:'hum',file:'hum.html',href:'3/hum.html'}
    ]},
  { p:5, name:'gate', color:'#DCA030', q:'what gets through?', ring:'R2', href:'5/',
    sections:[
      {label:'alarm',file:'alarm.md',href:'5/alarm.md'},
      {label:'kgate',file:'kgate.md',href:'5/kgate.md'},
      {label:'open-gate',file:'open-gate.html',href:'5/open-gate.html'},
      {label:'schumann',file:'schumann.html',href:'5/schumann.html'}
    ]},
  { p:7, name:'heart', color:'#28B450', q:'what do you feel?', ring:'R3', href:'7/',
    sections:[
      {label:'jedi',file:'jedi.html',href:'7/jedi.html'},
      {label:'7-ring',file:'seven-ring-paragraph.md',href:'7/seven-ring-paragraph.md'},
      {label:'songs/',file:'songs/',href:'7/songs/',sub:['earth-speaks','glacial','konomi-ass','konomi-gangsta','opus-floppy','prmfrq','sign-woody','thomas-bomb']}
    ]},
  { p:11, name:'voice', color:'#5078DC', q:'what do you decide?', ring:'R4', href:'11/',
    sections:[
      {label:'gaia-os',file:'gaia-os.md',href:'11/gaia-os.md'},
      {label:'isa-neural',file:'isa-neural.md',href:'11/isa-neural.md'},
      {label:'konomi',file:'konomi-standard.md',href:'11/konomi-standard.md'},
      {label:'sandbox',file:'sandbox.html',href:'11/sandbox.html'},
      {label:'specs/',file:'specs/',href:'11/specs/',sub:['acg-net','resonance','symbeyond','third-impact']}
    ]},
  { p:13, name:'mirror', color:'#8C50C8', q:'who are you?', ring:'R5', href:'13/',
    sections:[
      {label:'ring-types',file:'ring-types.md',href:'13/ring-types.md'},
      {label:'iris/',file:'iris/',href:'13/iris/',sub:['factory','trainer']},
      {label:'shield/',file:'shield/',href:'13/shield/',sub:['breath','cascade','flat','orb']}
    ]},
  { p:17, name:'watcher', color:'#787878', q:'who sees it all?', ring:'R6', href:'17/',
    sections:[
      {label:'dashboard',file:'dashboard.html',href:'17/dashboard.html'},
      {label:'observer',file:'observer.md',href:'17/observer.md'},
      {label:'papers/',file:'papers/',href:'17/papers/',sub:['earth-H','quasar-gate','schumann-nlp']}
    ]}
];

// ─── Canvas ───
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// ─── State ───
let globalSpeed = 0.3;
let showLabels = true;
let showGlow = true;
let spinning = true;
let zoom = 1;
let hovered = null; // {ring, section} or null
let dragging = null; // ring index being dragged
let dragStart = 0;
let mouseX = 0, mouseY = 0;

// Each ring has its own rotation angle and speed
const ringState = RINGS.map((r, i) => ({
  angle: (i * Math.PI * 2) / 7, // staggered start
  speed: (0.003 + i * 0.0008) * (i % 2 === 0 ? 1 : -1), // alternate directions
  hoverExpand: 0 // smooth expand on hover
}));

// ─── Geometry ───
const HOLE_R = 0.08;      // center hole radius (fraction of min dim)
const RING_GAP = 0.008;   // gap between rings
const RING_WIDTH = 0.045;  // each ring thickness
const ARC_GAP = 0.012;    // gap between sections (radians)

function ringRadius(i) {
  const base = Math.min(W, H) * 0.5 * zoom;
  const inner = base * HOLE_R + base * (RING_GAP + RING_WIDTH) * i + base * RING_GAP * (i + 1);
  return { inner, outer: inner + base * RING_WIDTH + ringState[i].hoverExpand * 4 };
}

function hexRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ─── Draw ───
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
  bg.addColorStop(0, '#0e0e0e');
  bg.addColorStop(1, '#0a0a0a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Update rotation
  if (spinning) {
    ringState.forEach((rs, i) => {
      if (dragging !== i) rs.angle += rs.speed * globalSpeed;
    });
  }

  // Draw rings from outer to inner (so inner overlaps)
  for (let i = RINGS.length - 1; i >= 0; i--) {
    drawRing(i);
  }

  // Draw center hole
  drawHole();

  // Draw ring prime labels on the left side
  if (showLabels) drawRingLabels();

  requestAnimationFrame(draw);
}

function drawRing(i) {
  const ring = RINGS[i];
  const rs = ringState[i];
  const { inner, outer } = ringRadius(i);
  const sections = ring.sections;
  const n = sections.length;
  const totalGap = ARC_GAP * n;
  const arcLen = (Math.PI * 2 - totalGap) / n;

  // Smooth hover expand
  const isAnyHovered = hovered && hovered.ring === i;
  rs.hoverExpand += ((isAnyHovered ? 1 : 0) - rs.hoverExpand) * 0.1;

  for (let s = 0; s < n; s++) {
    const startAngle = rs.angle + s * (arcLen + ARC_GAP);
    const endAngle = startAngle + arcLen;
    const isHovered = hovered && hovered.ring === i && hovered.section === s;
    const alpha = isHovered ? 0.6 : 0.18;
    const strokeAlpha = isHovered ? 0.9 : 0.35;

    // Section arc
    ctx.beginPath();
    ctx.arc(cx, cy, outer, startAngle, endAngle);
    ctx.arc(cx, cy, inner, endAngle, startAngle, true);
    ctx.closePath();

    // Fill
    ctx.fillStyle = hexRgba(ring.color, alpha);
    ctx.fill();

    // Stroke
    ctx.strokeStyle = hexRgba(ring.color, strokeAlpha);
    ctx.lineWidth = isHovered ? 1.5 : 0.5;
    ctx.stroke();

    // Glow
    if (showGlow && (isHovered || alpha > 0.15)) {
      ctx.save();
      ctx.globalAlpha = isHovered ? 0.15 : 0.03;
      ctx.shadowColor = ring.color;
      ctx.shadowBlur = isHovered ? 20 : 8;
      ctx.beginPath();
      ctx.arc(cx, cy, outer, startAngle, endAngle);
      ctx.arc(cx, cy, inner, endAngle, startAngle, true);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Label on the arc
    if (showLabels) {
      const midAngle = (startAngle + endAngle) / 2;
      const labelR = (inner + outer) / 2;
      const lx = cx + Math.cos(midAngle) * labelR;
      const ly = cy + Math.sin(midAngle) * labelR;

      ctx.save();
      ctx.translate(lx, ly);
      // Rotate text to follow arc, keep readable
      let textAngle = midAngle;
      if (textAngle > Math.PI / 2 && textAngle < Math.PI * 1.5) textAngle += Math.PI;
      if (textAngle > Math.PI * 2.5) textAngle -= Math.PI * 2;
      ctx.rotate(textAngle);
      ctx.fillStyle = hexRgba(ring.color, isHovered ? 1 : 0.6);
      ctx.font = `${isHovered ? 'bold ' : ''}${isHovered ? 10 : 8}px Courier New`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(sections[s].label, 0, 0);
      ctx.restore();
    }

    // Sub-items indicator (dot count)
    if (sections[s].sub && showLabels) {
      const midAngle = (startAngle + endAngle) / 2;
      const dotR = outer + 4;
      const dx = cx + Math.cos(midAngle) * dotR;
      const dy = cy + Math.sin(midAngle) * dotR;
      ctx.fillStyle = hexRgba(ring.color, 0.3);
      ctx.font = '7px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(sections[s].sub.length, dx, dy);
    }
  }

  // Ring track (faint circle)
  ctx.beginPath();
  ctx.arc(cx, cy, (inner + outer) / 2, 0, Math.PI * 2);
  ctx.strokeStyle = hexRgba(ring.color, 0.04);
  ctx.lineWidth = outer - inner;
  ctx.stroke();
}

function drawHole() {
  const base = Math.min(W, H) * 0.5 * zoom;
  const holeR = base * HOLE_R;
  const isHovered = hovered && hovered.ring === -1;

  // Hole gradient
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, holeR * 1.5);
  grad.addColorStop(0, isHovered ? 'rgba(220,160,48,0.08)' : 'rgba(0,0,0,0.9)');
  grad.addColorStop(0.7, 'rgba(0,0,0,0.6)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, holeR * 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Hole ring
  ctx.beginPath();
  ctx.arc(cx, cy, holeR, 0, Math.PI * 2);
  ctx.strokeStyle = isHovered ? 'rgba(220,160,48,0.5)' : 'rgba(220,160,48,0.12)';
  ctx.lineWidth = isHovered ? 1.5 : 0.5;
  ctx.stroke();

  if (showLabels) {
    ctx.fillStyle = isHovered ? 'rgba(220,160,48,0.8)' : 'rgba(220,160,48,0.25)';
    ctx.font = `${isHovered ? 'bold ' : ''}9px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('HOLE', cx, cy);
  }
}

function drawRingLabels() {
  // Draw p=N labels along the left side
  for (let i = 0; i < RINGS.length; i++) {
    const { inner, outer } = ringRadius(i);
    const midR = (inner + outer) / 2;
    const angle = Math.PI; // left side
    const lx = cx + Math.cos(angle) * midR - 30;
    const ly = cy + Math.sin(angle) * midR;
    const isRingHovered = hovered && hovered.ring === i;

    ctx.save();
    ctx.globalAlpha = isRingHovered ? 0.8 : 0.15;
    ctx.fillStyle = RINGS[i].color;
    ctx.font = '8px Courier New';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(`p=${RINGS[i].p}`, lx, ly);
    ctx.restore();
  }
}

// ─── Hit detection ───
function hitTest(mx, my) {
  const dx = mx - cx, dy = my - cy;
  const dist = Math.hypot(dx, dy);
  const angle = Math.atan2(dy, dx);

  // Check center hole
  const base = Math.min(W, H) * 0.5 * zoom;
  if (dist < base * HOLE_R) return { ring: -1, section: -1 };

  // Check rings
  for (let i = 0; i < RINGS.length; i++) {
    const { inner, outer } = ringRadius(i);
    if (dist >= inner && dist <= outer) {
      // Which section?
      const rs = ringState[i];
      const sections = RINGS[i].sections;
      const n = sections.length;
      const totalGap = ARC_GAP * n;
      const arcLen = (Math.PI * 2 - totalGap) / n;

      for (let s = 0; s < n; s++) {
        let startAngle = rs.angle + s * (arcLen + ARC_GAP);
        let endAngle = startAngle + arcLen;
        // Normalize angles
        let a = angle;
        // Bring everything into comparable range
        startAngle = ((startAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        endAngle = startAngle + arcLen;
        a = ((a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);

        if (endAngle > Math.PI * 2) {
          // Section wraps around
          if (a >= startAngle || a <= endAngle - Math.PI * 2) {
            return { ring: i, section: s };
          }
        } else if (a >= startAngle && a <= endAngle) {
          return { ring: i, section: s };
        }
      }
      // In the ring but in a gap
      return { ring: i, section: -1 };
    }
  }
  return null;
}

// ─── Mouse events ───
canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;

  if (dragging !== null) {
    const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
    ringState[dragging].angle = dragStart + (angle - dragStartAngle);
    return;
  }

  const hit = hitTest(e.clientX, e.clientY);
  hovered = hit;

  if (hit && hit.ring >= 0 && hit.section >= 0) {
    const ring = RINGS[hit.ring];
    const sec = ring.sections[hit.section];
    document.getElementById('hover-name').textContent = `p=${ring.p} · ${sec.label}`;
    document.getElementById('hover-name').style.color = ring.color;
    document.getElementById('hover-q').textContent = ring.q;
    document.getElementById('hover-path').textContent = sec.href + (sec.sub ? ` (${sec.sub.length} items)` : '') + ' · click to open';
    canvas.style.cursor = 'pointer';
  } else if (hit && hit.ring >= 0) {
    const ring = RINGS[hit.ring];
    document.getElementById('hover-name').textContent = `p=${ring.p} · ${ring.name}`;
    document.getElementById('hover-name').style.color = ring.color;
    document.getElementById('hover-q').textContent = ring.q;
    document.getElementById('hover-path').textContent = ring.href + ' · drag to spin ring';
    canvas.style.cursor = 'grab';
  } else if (hit && hit.ring === -1) {
    document.getElementById('hover-name').textContent = 'THE HOLE';
    document.getElementById('hover-name').style.color = '#DCA030';
    document.getElementById('hover-q').textContent = 'the center of everything';
    document.getElementById('hover-path').textContent = 'hole/ · click to enter';
    canvas.style.cursor = 'pointer';
  } else {
    document.getElementById('hover-name').textContent = 'A.S.S. IRIS';
    document.getElementById('hover-name').style.color = '#DCA030';
    document.getElementById('hover-q').textContent = '7 rings · 7 primes · click to navigate';
    document.getElementById('hover-path').textContent = 'scroll to zoom · drag rings to spin';
    canvas.style.cursor = 'default';
  }
});

let dragStartAngle = 0;
canvas.addEventListener('mousedown', (e) => {
  const hit = hitTest(e.clientX, e.clientY);
  if (hit && hit.ring >= 0 && hit.section === -1) {
    dragging = hit.ring;
    dragStart = ringState[hit.ring].angle;
    dragStartAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
    canvas.style.cursor = 'grabbing';
  } else if (!hit) {
    // Drag all rings
    dragging = 'all';
    dragStart = ringState.map(rs => rs.angle);
    dragStartAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
    canvas.style.cursor = 'grabbing';
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (dragging !== null) {
    const moved = Math.abs(Math.atan2(e.clientY - cy, e.clientX - cx) - dragStartAngle);
    if (moved < 0.02) {
      // It was basically a click, not a drag
      const hit = hitTest(e.clientX, e.clientY);
      handleClick(hit);
    }
    dragging = null;
    return;
  }
});

canvas.addEventListener('click', (e) => {
  if (dragging !== null) return;
  const hit = hitTest(e.clientX, e.clientY);
  handleClick(hit);
});

function handleClick(hit) {
  if (!hit) return;
  if (hit.ring >= 0 && hit.section >= 0) {
    const sec = RINGS[hit.ring].sections[hit.section];
    log.info('navigate', { pipe: RINGS[hit.ring].p, file: sec.label });
    window.location.href = sec.href;
  } else if (hit.ring >= 0 && hit.section === -1) {
    log.info('navigate ring', { pipe: RINGS[hit.ring].p });
    window.location.href = RINGS[hit.ring].href;
  } else if (hit.ring === -1) {
    log.info('navigate hole');
    window.location.href = 'hole/';
  }
}

// Zoom
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoom = Math.max(0.4, Math.min(2, zoom + e.deltaY * -0.001));
}, { passive: false });

// Update drag for 'all' mode
const origMouseMove = canvas.onmousemove;
canvas.addEventListener('mousemove', (e) => {
  if (dragging === 'all') {
    const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
    const delta = angle - dragStartAngle;
    ringState.forEach((rs, i) => { rs.angle = dragStart[i] + delta; });
  }
});

// Touch
let touchId = null, touchDragRing = null, touchDragStart = 0, touchStartAngle = 0;
canvas.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  const hit = hitTest(t.clientX, t.clientY);
  touchStartAngle = Math.atan2(t.clientY - cy, t.clientX - cx);
  if (hit && hit.ring >= 0) {
    touchDragRing = hit.ring;
    touchDragStart = ringState[hit.ring].angle;
  } else {
    touchDragRing = 'all';
    touchDragStart = ringState.map(rs => rs.angle);
  }
});
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  const a = Math.atan2(t.clientY - cy, t.clientX - cx);
  const delta = a - touchStartAngle;
  if (touchDragRing === 'all') {
    ringState.forEach((rs, i) => { rs.angle = touchDragStart[i] + delta; });
  } else if (touchDragRing !== null) {
    ringState[touchDragRing].angle = touchDragStart + delta;
  }
}, { passive: false });
canvas.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const moved = Math.abs(Math.atan2(t.clientY - cy, t.clientX - cx) - touchStartAngle);
  if (moved < 0.05) {
    const hit = hitTest(t.clientX, t.clientY);
    handleClick(hit);
  }
  touchDragRing = null;
});

// ─── Controls ───
function toggleSpin() {
  spinning = !spinning;
  document.getElementById('btn-spin').classList.toggle('active', spinning);
}
function toggleLabels() {
  showLabels = !showLabels;
  document.getElementById('btn-labels').classList.toggle('active', showLabels);
}
function toggleGlow() {
  showGlow = !showGlow;
  document.getElementById('btn-glow').classList.toggle('active', showGlow);
}
function setSpeed(v) { globalSpeed = v / 100; }
window.toggleSpin = toggleSpin;
window.toggleLabels = toggleLabels;
window.toggleGlow = toggleGlow;
window.setSpeed = setSpeed;

draw();
log.info('iris orrery initialized');
ASSLogger.composite([2, 3, 5, 7, 11, 13, 17], 'iris orrery loaded');
</script>
</body>
</html>
